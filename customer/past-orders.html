<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past Orders — CoffeeBot Exchange</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="navMount"></div>
  <main class="main">
    <header class="page-head">
      <div>
        <h1>Past orders</h1>
      </div>
      <div class="head-actions">
        <a class="btn-primary" href="order.html">New request</a>
      </div>
    </header>

    <div class="kpis">
      <div class="kpi"><div class="num" id="sCount">—</div><div class="lbl">Requests made</div></div>
      <div class="kpi"><div class="num green" id="sAccepted">—</div><div class="lbl">Accepted</div></div>
      <div class="kpi"><div class="num amber" id="sPending">—</div><div class="lbl">Pending</div></div>
      <div class="kpi"><div class="num" id="sKg">—</div><div class="lbl">Total kg requested</div></div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Ticket</th><th>Use case</th><th>Region</th><th class="num">Volume</th><th>Frequency</th><th>Date &amp; time</th><th>Status</th></tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div id="emptyNote" class="empty-note" style="display:none;">No past orders yet.</div>
    </div>
  </main>
  <div id="footMount"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    const session = CBUI.requireAuth("customer");
    if (session) {
      CBUI.mount("#navMount", CBUI.topbar({ role: "customer", activePage: "past-orders.html" }));
      CBUI.mount("#footMount", CBUI.footer({ role: "customer" }));
      const MY_NAME = "Simei RC Community Garden";
      const state = CB.getState();
      const mine = state.requests.filter((r) => r.customer === MY_NAME).sort((a, b) => b.createdAt - a.createdAt);

      document.getElementById("sCount").textContent = mine.length;
      document.getElementById("sAccepted").textContent = mine.filter((r) => r.status === "accepted").length;
      document.getElementById("sPending").textContent = mine.filter((r) => r.status === "pending").length;
      document.getElementById("sKg").textContent = mine.reduce((a, r) => a + r.volumeKg, 0).toFixed(1) + " kg";

      const body = document.getElementById("ordersBody");
      if (!mine.length) {
        document.getElementById("emptyNote").style.display = "block";
        body.closest("table").style.display = "none";
      } else {
        body.innerHTML = mine.map((r) => `
          <tr>
            <td>${r.id}</td>
            <td>${r.useCase}</td>
            <td><span class="pill region">${CB.regionName(r.region)}</span></td>
            <td class="num">${r.volumeKg} kg</td>
            <td>${r.frequency}</td>
            <td>${CB.fmtDate(r.createdAt)}</td>
            <td><span class="pill ${r.status}">${r.status}</span></td>
          </tr>`).join("");
      }
    }
  </script>
</body>
</html>
