<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request &amp; Log — CoffeeBot Exchange</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="navMount"></div>
  <main class="main">
    <header class="page-head">
      <div>
        <h1>Request grounds, log your impact</h1>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-tab="request">Request grounds</button>
      <button type="button" class="tab" role="tab" data-tab="usage">Log usage</button>
    </div>

    <section data-panel="request" class="form-narrow">
      <div class="card" id="requestCard">
        <div class="card-head">
          <h2>This week's request</h2>
          <span class="subtext">Ticket <span id="ticketNo"></span></span>
        </div>
        <form id="requestForm">
          <div class="form-row">
            <div class="field">
              <label for="rName">Your organisation</label>
              <div class="input-box"><input type="text" id="rName" placeholder="e.g. Tampines Community Garden" required></div>
              <span class="hint">The garden, school or group receiving the grounds.</span>
            </div>
            <div class="field">
              <label for="rRegion">Region</label>
              <div class="input-box"><select id="rRegion" required></select></div>
            </div>
          </div>
          <div class="field">
            <label for="rAddress">Address</label>
            <div class="input-box"><input type="text" id="rAddress" placeholder="e.g. 1 Tampines Walk, #01-01" required></div>
            <span class="hint">Where you'll use the grounds.</span>
          </div>
          <div class="field">
            <label for="rUse">What will you use the grounds for?</label>
            <textarea class="ta" id="rUse" placeholder="e.g. Composting for raised garden beds, weekly" required></textarea>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="rVolume">Grounds needed (kg)</label>
              <div class="input-box"><input type="number" id="rVolume" placeholder="1.5" step="0.1" min="0.1" required></div>
            </div>
            <div class="field">
              <label for="rFreq">Pickup frequency</label>
              <div class="input-box">
                <select id="rFreq">
                  <option>Weekly</option>
                  <option>Fortnightly</option>
                  <option>One-off</option>
                </select>
              </div>
            </div>
          </div>
          <div class="field">
            <label for="rBid">Price per kg (optional)</label>
            <div class="input-box"><input type="number" id="rBid" placeholder="0.00" step="0.10" min="0"></div>
            <span class="hint">$0 is the norm. Price doesn't improve your chances — a clear use case does.</span>
          </div>
          <button type="submit" class="btn-primary">Submit request</button>
        </form>
      </div>

    </section>

    <section data-panel="usage" class="layout-1-1">
      <div class="card">
        <div class="card-head">
          <h2>Log last week's usage</h2>
        </div>
        <form id="usageForm">
          <div class="form-row">
            <div class="field">
              <label for="uCompost">Compost / product made (kg)</label>
              <div class="input-box"><input type="number" id="uCompost" placeholder="1.2" step="0.1" min="0" required></div>
            </div>
            <div class="field">
              <label for="uSoil">Soil health (1–5, self-assessed)</label>
              <div class="input-box"><input type="number" id="uSoil" min="1" max="5" placeholder="4" required></div>
            </div>
          </div>
          <button type="submit" class="btn-primary">Log usage</button>
        </form>
      </div>

      <div class="card">
        <div class="card-head"><h2>Usage history</h2></div>
        <div class="row-list" id="myUsage"></div>
      </div>
    </section>
  </main>
  <div id="footMount"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/config.js"></script>
  <script>
    const session = CBUI.requireAuth("customer");
    if (session) CB.ready().then(() => {
      CBUI.mount("#navMount", CBUI.topbar({ role: "customer", activePage: "order.html" }));
      CBUI.mount("#footMount", CBUI.footer({ role: "customer" }));
      const MY_NAME = "Simei RC Community Garden";
      const MY_REGION = "east";

      document.getElementById("rRegion").innerHTML = CBUI.regionOptions(MY_REGION);
      document.getElementById("rName").value = MY_NAME;

      function renderTicketNo() {
        const state = CB.getState();
        document.getElementById("ticketNo").textContent = "#" + CB.nextId("R", state.requests);
      }
      renderTicketNo();

      function renderUsage() {
        const state = CB.getState();
        const mine = state.usageLogs.filter((u) => u.customer === MY_NAME);
        const list = document.getElementById("myUsage");
        list.innerHTML = mine.length
          ? mine.map((u) => `
            <div class="row">
              <div class="row-main">
                <div class="title">${u.compostKg} kg made · soil rating ${u.soilRating}/5</div>
                <div class="meta">~${(u.compostKg * 2.8).toFixed(1)} kg CO₂e (est.) · ${CB.fmtDate(u.loggedAt)}</div>
              </div>
            </div>`).join("")
          : '<div class="empty-note">No usage logged yet.</div>';
      }
      renderUsage();

      document.getElementById("requestForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const name = document.getElementById("rName").value.trim() || MY_NAME;
        const region = document.getElementById("rRegion").value;
        const address = document.getElementById("rAddress").value.trim();
        const useCase = document.getElementById("rUse").value.trim();
        const volumeKg = parseFloat(document.getElementById("rVolume").value) || 0;
        const frequency = document.getElementById("rFreq").value;
        const priceOffered = parseFloat(document.getElementById("rBid").value) || 0;

        const btn = e.submitter;
        if (btn) btn.disabled = true;
        CB.addRequest({
          customer: name, region, address, useCase, volumeKg, frequency, priceOffered,
          status: "pending", createdAt: Date.now(),
        }).then(() => {
          CBUI.toast("Request submitted. Track it on your Home page.");
          document.getElementById("requestForm").reset();
          document.getElementById("rName").value = MY_NAME;
          document.getElementById("rRegion").value = MY_REGION;
          renderTicketNo();
        }).catch((err) => CBUI.toast("Couldn't submit request: " + err.message))
          .finally(() => { if (btn) btn.disabled = false; });
      });

      document.getElementById("usageForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const compostKg = parseFloat(document.getElementById("uCompost").value) || 0;
        const soilRating = parseInt(document.getElementById("uSoil").value, 10) || 0;
        const btn = e.submitter;
        if (btn) btn.disabled = true;
        CB.addUsageLog({
          customer: MY_NAME, region: MY_REGION, compostKg, soilRating, loggedAt: Date.now(),
        }).then(() => {
          CBUI.toast("Usage logged.");
          document.getElementById("usageForm").reset();
          renderUsage();
        }).catch((err) => CBUI.toast("Couldn't log usage: " + err.message))
          .finally(() => { if (btn) btn.disabled = false; });
      });

      // Status changes made by staff elsewhere show up when you return to the tab.
      document.addEventListener("cb:synced", () => { renderUsage(); renderTicketNo(); });

      CBUI.tabs();
    });
  </script>
</body>
</html>
