<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — CoffeeBot Exchange</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="navMount"></div>
  <main class="main">
    <header class="page-head">
      <div>
        <h1 id="greeting">Hello</h1>
      </div>
      <div class="head-actions">
        <a class="btn-secondary" href="order.html#usage">Log last week's usage</a>
        <a class="btn-primary" href="order.html">Request grounds <span id="icUpload"></span></a>
      </div>
    </header>

    <div class="kpis">
      <div class="kpi"><div class="num" id="statTotalKg">—</div><div class="lbl">Grounds received to date</div></div>
      <div class="kpi"><div class="num green" id="statCo2">—</div><div class="lbl">CO₂e saved (est.)</div></div>
      <div class="kpi"><div class="num amber" id="statPending">—</div><div class="lbl">Pending requests</div></div>
    </div>

    <div class="layout-2-1">
      <div class="card">
        <div class="card-head">
          <h2>Recent requests</h2>
          <a class="subtext link" href="past-orders.html">Full history</a>
        </div>
        <div class="row-list" id="recentRequests"></div>
      </div>

      <aside class="card">
        <div class="card-head">
          <h2>Collection point</h2>
          <span class="pill region" id="regionPill"></span>
        </div>
        <h3 id="siteName"></h3>
        <p class="subtext" id="siteMeta" style="margin-top:6px;"></p>
        <div class="card-doodle" id="siteDoodle"></div>
      </aside>
    </div>
  </main>
  <div id="footMount"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    const session = CBUI.requireAuth("customer");
    if (session) {
      CBUI.mount("#navMount", CBUI.topbar({ role: "customer", activePage: "home.html" }));
      CBUI.mount("#footMount", CBUI.footer({ role: "customer" }));
      document.getElementById("greeting").textContent = "Hello, " + session.email.split("@")[0];
      document.getElementById("icUpload").innerHTML = CBUI.icon("arrow", "icon-sm");
      document.getElementById("siteDoodle").innerHTML = CBUI.doodle("plant");

      const state = CB.getState();
      const myName = "Simei RC Community Garden"; // demo identity for this logged-in off-taker
      const mine = state.requests.filter((r) => r.customer === myName);
      const myPartner = state.partners.find((p) => p.name === myName);

      document.getElementById("statTotalKg").textContent = (myPartner ? myPartner.kgReceived : 0).toFixed(1) + " kg";
      document.getElementById("statCo2").textContent = "~" + (myPartner ? myPartner.co2eKg : 0).toFixed(1) + " kg";
      document.getElementById("statPending").textContent = mine.filter((r) => r.status === "pending").length;

      const region = CB.regionById(myPartner ? myPartner.region : "east");
      document.getElementById("regionPill").textContent = region.name;
      document.getElementById("siteName").textContent = region.location;
      document.getElementById("siteMeta").textContent =
        `~${region.cupsPerMonth.toLocaleString("en-SG")} cups a month · about ${CB.monthlyGroundsKg(region).toFixed(1)} kg of wet grounds, ~${CB.dryKg(CB.monthlyGroundsKg(region)).toFixed(1)} kg once dried`;

      const list = document.getElementById("recentRequests");
      if (mine.length === 0) {
        list.innerHTML = '<div class="empty-note">No requests yet.</div>';
      } else {
        list.innerHTML = mine
          .slice(0, 4)
          .map(
            (r) => `
          <div class="row">
            <div class="row-main">
              <div class="title">${r.useCase}</div>
              <div class="meta">${r.volumeKg} kg · ${r.frequency} · ${CB.fmtDate(r.createdAt)}</div>
            </div>
            <span class="pill ${r.status}">${r.status}</span>
          </div>`
          )
          .join("");
      }
    }
  </script>
</body>
</html>
