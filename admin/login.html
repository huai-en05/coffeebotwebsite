<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Log In — CoffeeBot Exchange</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="auth-shell">
    <aside class="auth-art">
      <a href="../index.html" class="brand">
        <span class="mark" id="markIcon"></span> <span class="brand-name">CoffeeBot <em>Exchange</em></span>
      </a>
      <div>
        <h2>Every cup, <em>given a second life.</em></h2>
        <p>Log collections, review requests and let Gemini draft this week's allocation across all five regions.</p>
      </div>
      <span class="bean"></span>
    </aside>
    <main class="auth-panel">
      <div class="card login-card">
        <div class="eyebrow">CoffeeBot Staff</div>
        <h1>Admin Log In</h1>
        <p class="subtext" style="margin-bottom:22px;">Manage collections, requests, forecasts, and allocation.</p>

        <form id="loginForm">
          <div class="field">
            <label>Email</label>
            <div class="input-box">
              <span id="mailIcon"></span>
              <input type="email" id="email" placeholder="admin@gmail.com" required value="admin@gmail.com">
            </div>
          </div>
          <div class="field">
            <label>Password</label>
            <div class="input-box">
              <span id="lockIcon"></span>
              <input type="password" id="password" placeholder="••••••••" required value="coffeebot123">
            </div>
          </div>
          <button type="submit" class="btn-primary full">Log In</button>
        </form>
        <p class="subtext" style="margin-top:16px;font-size:.8rem;">Demo account prefilled — just click Log In.</p>
      </div>
    </main>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById("markIcon").innerHTML = CBUI.icon("coffee","icon-sm");
    document.getElementById("mailIcon").innerHTML = CBUI.icon("mail","icon-sm");
    document.getElementById("lockIcon").innerHTML = CBUI.icon("lock","icon-sm");

    if (CB.getState().auth.admin) window.location.href = "home.html";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim() || "admin@gmail.com";
      CBUI.login("admin", email);
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
