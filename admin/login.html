<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Log In — CoffeeBot Exchange</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="auth-shell">
    <aside class="auth-art">
      <a href="../index.html" class="brand" id="brandLink">CoffeeBot <em>Exchange</em></a>
      <h2>Every cup, given a <em>second life</em>.</h2>
      <div id="authArt"></div>
    </aside>
    <main class="auth-panel">
      <div class="login-card">
        <h1>Staff log in</h1>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <div class="input-box">
              <span id="mailIcon"></span>
              <input type="email" id="email" placeholder="admin@gmail.com" required value="admin@gmail.com">
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-box">
              <span id="lockIcon"></span>
              <input type="password" id="password" placeholder="••••••••" required value="coffeebot123">
            </div>
          </div>
          <button type="submit" class="btn-primary full" style="margin-top:6px;">Log in</button>
        </form>
        <p class="subtext" style="margin-top:18px;font-size:.84rem;">Demo account prefilled. Off-taker partner? <a class="link" href="../customer/login.html">Partner log in</a></p>
      </div>
    </main>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById("mailIcon").innerHTML = CBUI.icon("mail","icon-sm");
    document.getElementById("lockIcon").innerHTML = CBUI.icon("lock","icon-sm");
    document.getElementById("brandLink").insertAdjacentHTML("afterbegin", CBUI.icon("cup"));
    document.getElementById("authArt").outerHTML = CBUI.doodle("unboxing") + CBUI.mark("star", "a") + CBUI.mark("sparkle", "b");

    if (CB.getState().auth.admin) window.location.href = "home.html";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim() || "admin@gmail.com";
      CBUI.login("admin", email);
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
