<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview — CoffeeBot Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="navMount"></div>
  <main class="main">
    <header class="page-head">
      <div>
        <h1 id="greeting">Welcome back</h1>
      </div>
      <div class="head-actions">
        <a class="btn-secondary" href="operations.html">Review requests</a>
        <a class="btn-primary" href="upload.html">Log a collection <span id="icUpload"></span></a>
      </div>
    </header>

    <div class="kpis">
      <div class="kpi"><div class="num" id="statKg">—</div><div class="lbl">Grounds diverted to date</div></div>
      <div class="kpi eco"><div class="num" id="statCo2">—</div><div class="lbl">CO₂e saved (est.)</div></div>
      <div class="kpi act"><div class="num" id="statPending">—</div><div class="lbl">Pending requests</div></div>
      <div class="kpi info"><div class="num" id="statPartners">—</div><div class="lbl">Active off-takers</div></div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-tab="week">This week</button>
      <button type="button" class="tab" role="tab" data-tab="briefing">AI briefing</button>
    </div>

    <section data-panel="week">
      <div data-alert-card style="margin-bottom:24px;"></div>

      <div class="layout-2-1">
        <div class="card">
          <div class="card-head">
            <h2>Collection map</h2>
            <span class="subtext" id="mapTotal"></span>
          </div>
          <div class="site-map" id="siteMap"></div>
          <div class="legend">
            <span><i style="background:var(--caramel);border-radius:50%;"></i>Collection site (bigger = more collected)</span>
            <span><i style="background:var(--kpi-bg);"></i>CoffeeBot office: drying &amp; pickup</span>
          </div>
          <p class="subtext" id="mapNote" style="font-size:.82rem;margin-top:8px;"></p>
        </div>

        <aside class="card">
          <div class="card-head">
            <h2>Latest requests</h2>
            <a class="subtext link" href="operations.html">View all</a>
          </div>
          <div class="row-list" id="latestRequests"></div>
        </aside>
      </div>
    </section>

    <section data-panel="briefing" class="layout-2-1">
      <div id="aiMount"></div>
      <aside id="ledgerMount"></aside>
    </section>
  </main>
  <div id="footMount"></div>

  <script src="../assets/js/data.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/weather.js"></script>
  <script src="../assets/js/ai.js"></script>
  <script src="../assets/js/alerts.js"></script>
  <script>
    const session = CBUI.requireAuth("admin");
    if (session) CB.ready().then(() => {
      CBUI.mount("#navMount", CBUI.topbar({ role: "admin", activePage: "home.html" }));
      CBUI.mount("#footMount", CBUI.footer({ role: "admin" }));
      document.getElementById("greeting").textContent = "Welcome back, " + session.email.split("@")[0];
      document.getElementById("icUpload").innerHTML = CBUI.icon("arrow", "icon-sm");

      const state = CB.getState();
      const totalKg = state.partners.reduce((a, p) => a + p.kgReceived, 0);
      const totalCo2 = state.partners.reduce((a, p) => a + p.co2eKg, 0);
      document.getElementById("statKg").textContent = totalKg.toFixed(1) + " kg";
      document.getElementById("statCo2").textContent = "~" + totalCo2.toFixed(1) + " kg";
      document.getElementById("statPending").textContent = state.requests.filter((r) => r.status === "pending").length;
      document.getElementById("statPartners").textContent = state.partners.length;

      CBUI.aiGenerator({
        container: "#aiMount",
        task: "briefing",
        title: "This week's briefing",
        buttonLabel: "Generate briefing",
        onGenerated: () => CBUI.greenLedger("#ledgerMount"),
      });
      CBUI.greenLedger("#ledgerMount");
      // Runs other staff generated show up when you come back to the tab.
      document.addEventListener("cb:synced", () => CBUI.greenLedger("#ledgerMount"));

      const latest = [...state.requests].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);
      document.getElementById("latestRequests").innerHTML = latest.map((r) => `
        <div class="row">
          <div class="row-main">
            <div class="title">${r.customer} <span class="pill region" style="margin-left:6px;">${CB.regionName(r.region)}</span></div>
            <div class="meta">${r.useCase}</div>
            <div class="meta">${r.volumeKg} kg · ${CB.fmtDate(r.createdAt)}</div>
          </div>
          <span class="pill ${r.status}">${r.status}</span>
        </div>`).join("");

      const siteMap = CBUI.collectionMap("#siteMap");
      document.getElementById("mapTotal").textContent = siteMap ? siteMap.weekTotal : "";
      document.getElementById("mapNote").textContent = CB.REGIONS.filter((r) => !r.collectable).map((r) => `${r.name}: ${r.note}`).join(" ");

      // Leaflet can't size a map inside a hidden tab, so re-measure when it's shown.
      CBUI.tabs({ onShow: (tab) => { if (tab === "week" && siteMap) siteMap.map.invalidateSize(); } });
    });
  </script>
</body>
</html>
