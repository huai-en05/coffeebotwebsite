<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allocation — CoffeeBot Admin</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="navMount"></div>
  <main class="main">
    <header class="page-head">
      <div>
        <h1>Allocation</h1>
      </div>
      <div class="head-actions">
        <button class="btn-primary" id="approveAllBtn"><span id="icCheck"></span> Approve all</button>
      </div>
    </header>

    <div id="feedbackBar" style="display:none;"></div>

    <div class="kpis">
      <div class="kpi act"><div class="num" id="sPending">—</div><div class="lbl">Pending requests scored</div></div>
      <div class="kpi act"><div class="num" id="sFulfilled">—</div><div class="lbl">Fully fulfillable this week</div></div>
      <div class="kpi"><div class="num" id="sSupply">—</div><div class="lbl">Dry-ready supply this week (weather-adjusted)</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Ranked recommendation</h2>
        <span class="subtext">Scored on quantity, regularity and purpose. Edit an amount or reject a request before approving.</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>#</th><th>Requester</th><th>Region</th><th class="num">Requested</th><th class="num">Allocate</th><th class="num">Score</th><th></th></tr>
          </thead>
          <tbody id="rankBody"></tbody>
        </table>
      </div>
    </div>

    <div id="aiMount" class="section-gap"></div>
  </main>
  <div id="footMount"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/weather.js"></script>
  <script src="../assets/js/ai.js"></script>
  <script src="../assets/js/alerts.js"></script>
  <script>
    const session = CBUI.requireAuth("admin");
    if (session) CB.ready().then(() => {
      CBUI.mount("#navMount", CBUI.topbar({ role: "admin", activePage: "allocation.html" }));
      CBUI.mount("#footMount", CBUI.footer({ role: "admin" }));
      document.getElementById("icCheck").innerHTML = CBUI.icon("check", "icon-sm");

      const esc = CBUI.esc;
      let result = CBAI.recommendAllocation();
      let editing = null; // id of the request whose amount is being edited

      // How the purpose was decided, so staff know which ones to double-check.
      function purposeTags(d) {
        const p = d.purposeInfo;
        const tags = [];
        if (p.source === "review") tags.push(`<span class="pill pending" title="Doesn't fit a category. Check before approving.">Needs review</span>`);
        if (p.source === "keywords") tags.push(`<span class="pill region" title="Sorted by keywords in the description. Generate an allocation review to let Gemini check it.">Sorted by keywords</span>`);
        if (p.source === "ai") tags.push(`<span class="pill ${p.benefit === "low" ? "declined" : p.benefit === "high" ? "accepted" : "pending"}" title="${esc(p.reason || "")}">AI: ${esc(p.benefit)} community benefit</span>`);
        return tags.length ? `<div class="alloc-tags">${tags.join("")}</div>` : "";
      }

      function allocateCell(d) {
        if (editing === d.id) {
          return `<div class="alloc-edit"><input type="number" id="editKg" min="0" step="0.1" value="${d.recommendedKg}" aria-label="Kilograms to allocate"> kg</div>`;
        }
        const why = d.edited ? "edited" : d.fulfilled ? "" : d.recommendedKg > 0 ? "partial" : "waitlisted";
        return `${d.recommendedKg} kg${why ? `<br><span class="alloc-why">${why}</span>` : ""}`;
      }

      function actionButtons(d) {
        if (editing === d.id) {
          return `<button class="btn-primary btn-sm" data-save="${d.id}">Save</button>
            <button class="btn-secondary btn-sm" data-cancel="${d.id}">Cancel</button>`;
        }
        return `<button class="btn-primary btn-sm" data-approve="${d.id}">Approve</button>
          <button class="btn-secondary btn-sm" data-edit="${d.id}">Edit</button>
          ${d.edited ? `<button class="btn-secondary btn-sm" data-reset="${d.id}" title="Go back to the recommended amount">Reset</button>` : ""}
          <button class="btn-danger btn-sm" data-reject="${d.id}">Reject</button>`;
      }

      function render() {
        result = CBAI.recommendAllocation();
        const { decisions, supply } = result;

        document.getElementById("sPending").textContent = decisions.length;
        document.getElementById("sFulfilled").textContent = decisions.filter((d) => d.fulfilled).length;
        document.getElementById("sSupply").textContent = supply.toFixed(supply < 1 ? 2 : 1) + " kg";

        document.getElementById("rankBody").innerHTML = decisions.length
          ? decisions.map((d, i) => {
            const note = d.useCase && d.useCase !== d.purposeInfo.purpose.label ? ` · ${esc(d.useCase)}` : "";
            return `
            <tr>
              <td>${i + 1}</td>
              <td style="min-width:220px;"><strong>${esc(d.customer)}</strong>
                <div class="subtext" style="font-size:.78rem;">${esc(d.frequency)} · <strong>${esc(d.purposeInfo.purpose.label)}</strong>${note}</div>
                ${purposeTags(d)}</td>
              <td><span class="pill region">${esc(CB.regionName(d.region))}</span></td>
              <td class="num">${d.volumeKg} kg</td>
              <td class="num" style="font-weight:700;color:${d.fulfilled ? "var(--ok)" : "var(--warn)"};">${allocateCell(d)}</td>
              <td class="num">${d.score}</td>
              <td><div class="alloc-actions">${actionButtons(d)}</div></td>
            </tr>`;
          }).join("")
          : `<tr><td colspan="7" class="empty-note" style="text-align:center;padding:24px;">No pending requests — everything's been decided.</td></tr>`;

        const on = (attr, fn) => document.querySelectorAll(`[data-${attr}]`).forEach((b) =>
          b.addEventListener("click", () => fn(decisions.find((d) => d.id === b.dataset[attr]))));
        on("approve", approveOne);
        on("reject", rejectOne);
        on("edit", (d) => { editing = d.id; render(); document.getElementById("editKg")?.select(); });
        on("cancel", () => { editing = null; render(); });
        on("reset", (d) => { CBAI.setAllocationEdit(d.id, null); render(); });
        on("save", saveEdit);
        document.getElementById("editKg")?.addEventListener("keydown", (e) => {
          if (e.key === "Enter") saveEdit(decisions.find((d) => d.id === editing));
          if (e.key === "Escape") { editing = null; render(); }
        });
      }

      function saveEdit(d) {
        const kg = parseFloat(document.getElementById("editKg").value);
        if (!(kg >= 0)) return CBUI.toast("Enter an amount of 0 kg or more.");
        CBAI.setAllocationEdit(d.id, Math.round(kg * 100) / 100);
        editing = null;
        render();
      }

      function showFeedback(msg) {
        const bar = document.getElementById("feedbackBar");
        bar.className = "feedback-bar";
        bar.innerHTML = CBUI.icon("check", "icon-sm") + msg;
        bar.style.display = "flex";
        setTimeout(() => (bar.style.display = "none"), 4000);
      }

      // Approving saves the amount allocated with the request, so the partner sees it.
      function approve(decisions) {
        const ids = decisions.map((d) => d.id);
        const kg = Object.fromEntries(decisions.map((d) => [d.id, d.recommendedKg]));
        return CB.setRequestStatus(ids, "accepted", kg).then(() => ids.forEach((id) => CBAI.setAllocationEdit(id, null)));
      }

      function approveOne(d) {
        approve([d]).then(() => {
          showFeedback(`${d.recommendedKg} kg approved for ${esc(d.customer)}.`);
          render();
        }).catch((err) => CBUI.toast("Couldn't approve: " + err.message));
      }

      function rejectOne(d) {
        if (!confirm(`Reject ${d.customer}'s request for ${d.volumeKg} kg?`)) return;
        CB.setRequestStatus([d.id], "declined").then(() => {
          CBAI.setAllocationEdit(d.id, null);
          showFeedback(`Request from ${esc(d.customer)} rejected.`);
          render();
        }).catch((err) => CBUI.toast("Couldn't reject: " + err.message));
      }

      document.getElementById("approveAllBtn").addEventListener("click", () => {
        const pending = new Set(CB.getState().requests.filter((r) => r.status === "pending").map((r) => r.id));
        const decisions = result.decisions.filter((d) => pending.has(d.id));
        approve(decisions).then(() => {
          if (decisions.length) showFeedback(`${decisions.length} request${decisions.length > 1 ? "s" : ""} approved for this week's allocation.`);
          render();
        }).catch((err) => CBUI.toast("Couldn't approve: " + err.message));
      });

      render();
      // New partner requests show up when you return to the tab.
      document.addEventListener("cb:synced", render);
      // Allocation draws on weather-adjusted supply, so redo it once a fresh forecast arrives.
      CBWeather.load().then(render).catch(() => {});

      CBUI.aiGenerator({
        container: "#aiMount",
        task: "allocation",
        title: "Allocation review",
        buttonLabel: "Generate",
        // Gemini sorts "Others" purposes, which changes the scores.
        onGenerated: render,
      });
    });
  </script>
</body>
</html>
